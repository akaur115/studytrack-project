services:
  postgres:
    image: postgres:16
    container_name: studytrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studytrack
    ports:
      - "5432:5432"
    volumes:
      - studytrack_postgres_data:/var/lib/postgresql/data

volumes:
  studytrack_postgres_data: