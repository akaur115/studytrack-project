services:
  studytrack-db:
    image: postgres:16
    container_name: studytrack-db
    restart: always
    environment:
      POSTGRES_USER: studytrack_user
      POSTGRES_PASSWORD: studytrack_password
      POSTGRES_DB: studytrack_db
    ports:
      - "5433:5432"
    volumes:
      - studytrack_pgdata:/var/lib/postgresql/data

volumes:
  studytrack_pgdata: